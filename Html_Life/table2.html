<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="2" cellpadding="20">
        <tr>
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <!-- rowsapn=merging tables -->
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <!-- <td>6</td> -->
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
    </table>
    <br>
    <br>

    <table border="4" cellpadding="25" cellspacing="5" >
        <caption>Student Info</caption>

        <thead>
            <tr>
                <th colspan="3"> Student</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td colspan="2">4</td>
                <td>5</td>
                <!-- <td>6</td> -->
            </tr>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3" align="center"> Total</td>
            </tr>
        </tfoot>

    </table>

    <br>
    <br>

    <br>

    <table border="4" cellpadding="25">
        <tr>
            <th colspan="6"> Time Table</th>
        </tr>

        <tr>
            <td rowspan="6">Hours</td>
            <td>mon</td>
            <td>tues</td>
            <td>Wed</td>
            <td>Thrus</td>
            <td>Fri</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>
            <td>Maths</td>
            <td>Arts</td>

        </tr>
        <tr>
            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>
            <td>Maths</td>
            <td>Arts</td>

        </tr>
        <tr>
            <td colspan="5" align="center"> Lunch</td>

        </tr>
        <tr>
            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>
            <td>Maths</td>
            <td rowspan="2"> Project</td>

        </tr>
        <tr>
            <td>Science</td>
            <td>Maths</td>
            <td>Science</td>
            <td>Maths</td>
        </tr>
    </table>

</body>

</html>
