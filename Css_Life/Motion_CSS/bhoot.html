<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            padding: 30px;
            display: flex;
            align-content: center;
            justify-content: center;
           
        }
        .main{
            width: 400px;
            height: 400px;
            border: 3px solid white;
            /* background-color: black; */
            border-radius: 50%;
            box-shadow:2px 2px 3px 3px ;
            animation: bhoot 6s infinite linear ;

        }
        .child{
            height: 100px;
            width: 100px;
            position: absolute;
            background-color: gold;
            box-shadow: 2px 2px 4px 3px ;
            top: -10px;
            border-radius: 50%;

        }

        @keyframes bhoot{
           0%{
            transform: rotate(0deg);
           }
           100%{
            transform: rotate(360deg);
           }
        }
    </style>
</head>
<body>
    <div class="main">
       <div class="child"></div>
    </div>
</body>
</html>
