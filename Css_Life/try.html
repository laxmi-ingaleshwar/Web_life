<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>one8 - Performance Footwear</title>
    <link rel="stylesheet" href="try.css">
</head>
<body>

    <div class="hero">

        <!-- Navigation Bar -->
        <nav class="navbar">

            <div class="nav-links">
                <a href="#">Featured</a>
                <a href="#">Women</a>
                <a href="#">Men</a>
                <a href="#">Kids</a>
            </div>

            <div class="logo">
                <span class="logo-icon">♙</span>
                <span>one8</span>
            </div>

            <div class="nav-right">

                <div class="search">
                    <span>⌕</span>
                    <input type="text" placeholder="Search for Tshirts">
                </div>

                <span class="icon">♡</span>
                <span class="icon">ϟ</span>
                <span class="icon">♧</span>

            </div>

        </nav>

        <!-- Background Image -->
        <div class="hero-image" id="heroImage"></div>

        <!-- Main Content -->
        <div class="content">

            <h1>
                DROP
                <span class="season">
                    <small>Of</small> the SEASON
                </span>
            </h1>

            <h2 id="productName">
                Seam XVIII Signature - Red
            </h2>

            <p>Born In Cricket, Stitched In Culture</p>

            <div class="buttons">
                <button>Shop Now</button>
                <button>View Collection</button>
            </div>

        </div>

        <!-- Slider Dots -->
        <div class="dots">
            <span class="dot active" onclick="changeSlide(0)"></span>
            <span class="dot" onclick="changeSlide(1)"></span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
