<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .container{
           width: 20vw;
           height: 50vh;
           border: 2px solid red;
           margin: 50px;
        }
        .child{
            width: 10vw;
           height: 10vh;
           border: 2px solid greenyellow;
           background-color: blue;
           margin: 20px;
        }
        #child1{
            margin-bottom: 50px;
            margin: 20px;
        }
        #child2{
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child" id="child1"></div>
        <div class="child" id="child2"></div>
    </div>
</body>
</html>
