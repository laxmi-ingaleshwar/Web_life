<!DOCTYPE html>
<html lang="en">
<head>

    <style>

            padding: 0%;
            margin: 0%;
        }
        .container{
            height: 500px;
            width: 200px;

            height: 150px;
            width: 150px;
            background-color: blueviolet;
            border: 20px solid red;
        }
        #child1{
            margin-bottom: 50px;
        }
        #child2{
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="child"  id="child1"></div>
        <div class="child"  id="child2"></div>
    </div>
</body>
</html>
